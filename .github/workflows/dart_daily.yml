name: DART Daily Filter DM

on:
  schedule:
    - cron: "10 9 * * *" # 18:10 KST
  workflow_dispatch:
    inputs:
      days_ago:
        description: "0=오늘, 1=어제"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 2026-07-21 실행이 6시간(잡 최대치)까지 매달려 강제 취소된 적이 있다.
    # DART 응답이 느려지면 종목별 재시도가 누적되어 무한정 늘어나므로 상한을 둔다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS_AGO: ${{ github.event.inputs.days_ago || '0' }}
        run: |
          SCRIPT="dart_filter_to_telegram.py"
          if [ ! -f "$SCRIPT" ]; then SCRIPT="dart_filter_to_telegram"; fi
          python "$SCRIPT" --days-ago "$DAYS_AGO"
