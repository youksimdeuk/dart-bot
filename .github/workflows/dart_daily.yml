name: DART Daily Filter DM

# DART는 elestock.json 등 구조화 데이터를 공시 접수 후 몇 시간에 걸쳐 채운다.
# 당일 저녁에 돌리면 아직 안 채워진 건을 놓친다(같은 날짜를 반복 조회하면
# 건수가 계속 늘어나지만, 며칠 지난 날짜는 항상 동일하다).
# 그래서 다음날 아침에 '전일치'를 조회한다.
on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST (전일 공시 대상)
  workflow_dispatch:
    inputs:
      days_ago:
        description: "1=전일(기본), 0=당일"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 2026-07-21 실행이 6시간(잡 최대치)까지 매달려 강제 취소된 적이 있다.
    # DART 응답이 느려지면 종목별 재시도가 누적되어 무한정 늘어나므로 상한을 둔다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS_AGO: ${{ github.event.inputs.days_ago || '1' }}
        run: |
          SCRIPT="dart_filter_to_telegram.py"
          if [ ! -f "$SCRIPT" ]; then SCRIPT="dart_filter_to_telegram"; fi
          python "$SCRIPT" --days-ago "$DAYS_AGO"
